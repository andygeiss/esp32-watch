## The panel and the touch controller of one specific board, so both are
## pinned exactly. A floating driver here buys nothing and can only break a
## build that has no hardware in front of it.
dependencies:
  idf:
    version: ">=5.3"
  # SH8601-compatible QSPI AMOLED controller. Waveshare's own fork: it is the
  # one their BSP for this board uses.
  waveshare/esp_lcd_sh8601:
    version: "==2.0.0"
  # The touch panel speaks the FT5x06 protocol over I2C.
  espressif/esp_lcd_touch_ft5x06:
    version: "==1.1.1"
  # Its own dependency, named again here on purpose: the ft5x06 component
  # keeps esp_lcd_touch private, so its header's #include "esp_lcd_touch.h"
  # only resolves for a component that asks for it directly.
  espressif/esp_lcd_touch:
    version: "==1.2.1"
  # The audio path: an ES8311 to the speaker and an ES7210 in front of the
  # microphones, both on the I2C bus the touch controller already sits on.
  # esp_codec_dev is the driver for both and the version Waveshare's own BSP
  # for this board pins, which is the only reason to trust the register
  # sequences inside it.
  espressif/esp_codec_dev:
    version: "==1.3.1"
